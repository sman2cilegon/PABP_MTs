<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hitung Rata-rata Nilai</title>
<style>
body{
  font-family: Arial, sans-serif;
  background: #f4f4f4;
  margin:0;
  padding:20px 10px;
  box-sizing:border-box;
}
.container{
  background:white;
  padding:20px;
  border-radius:18px;
  width:100%;
  max-width:420px;
  margin:20px auto;
  box-shadow:0 10px 25px rgba(0,0,0,0.2);
  border:none;
  box-sizing:border-box;
}
h2{text-align:center;color:#065f46;font-size:24px;margin-bottom:20px;}
label{font-weight:bold;color:#14532d;display:block;margin-top:10px;}
input{width:100%;padding:10px;margin-top:5px;border:2px solid #22c55e;border-radius:10px;box-sizing:border-box;}
.btn-group{display:flex;gap:10px;margin-top:20px;flex-wrap:wrap;}
button{flex:1;padding:12px;border:none;border-radius:10px;color:white;font-size:16px;cursor:pointer;min-width:120px;}
.hitung{background:#16a34a;}.reset{background:#dc2626;}
.hasil{margin-top:20px;padding:15px;background:#ecfccb;border-radius:12px;text-align:center;font-size:18px;font-weight:bold;color:#14532d;}
@media (max-width:480px){
 h2{font-size:18px;}
 button{font-size:14px;padding:10px;min-width:100%;}
 .btn-group{flex-direction:column;}
 .hasil{font-size:15px;}
 .container{padding:15px;margin:10px auto;}
 input{padding:9px;}
}
 button{font-size:14px;padding:10px;}
 .hasil{font-size:16px;}
}
</style>
</head>
<body>
<div class="container">

<h2>Nilai Rata-rata PABP MTs</h2>
<label>Al Quran Hadist</label><input type="number" id="aqh">
<label>Akidah Akhlaq</label><input type="number" id="akidah">
<label>Fiqih</label><input type="number" id="fiqih">
<label>Sejarah Kebudayaan Islam</label><input type="number" id="ski">
<div class="btn-group">
<button class="hitung" onclick="hitungRataRata()">Hitung</button>
<button class="reset" onclick="resetForm()">Reset</button>
</div>
<div class="hasil" id="hasil">Hasil rata-rata akan muncul di sini</div>
</div>
<script>
function hitungRataRata(){
 let aqh=parseFloat(document.getElementById('aqh').value)||0;
 let akidah=parseFloat(document.getElementById('akidah').value)||0;
 let fiqih=parseFloat(document.getElementById('fiqih').value)||0;
 let ski=parseFloat(document.getElementById('ski').value)||0;
 let rata=(aqh+akidah+fiqih+ski)/4;
 document.getElementById('hasil').innerHTML='Rata-rata: '+rata.toFixed(2)+'<br>Pembulatan: '+Math.round(rata);
}
function resetForm(){
 document.getElementById('aqh').value='';
 document.getElementById('akidah').value='';
 document.getElementById('fiqih').value='';
 document.getElementById('ski').value='';
 document.getElementById('hasil').innerHTML='Hasil rata-rata akan muncul di sini';
}
</script>
</body>
</html>
