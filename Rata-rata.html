<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hitung Rata-rata Nilai</title>

  <style>
    body{
      font-family: Arial, sans-serif;
      background: #f4f4f4;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    .container{
      background: white;
      padding: 25px;
      border-radius: 10px;
      width: 350px;
      box-shadow: 0 0 10px rgba(0,0,0,0.2);
    }

    h2{
      text-align: center;
      margin-bottom: 20px;
    }

    label{
      font-weight: bold;
      display: block;
      margin-top: 10px;
    }

    input{
      width: 100%;
      padding: 8px;
      margin-top: 5px;
      border: 1px solid #ccc;
      border-radius: 5px;
    }

    button{
      width: 100%;
      padding: 10px;
      margin-top: 20px;
      border: none;
      background: #007bff;
      color: white;
      font-size: 16px;
      border-radius: 5px;
      cursor: pointer;
    }

    button:hover{
      background: #0056b3;
    }

    .hasil{
      margin-top: 20px;
      padding: 10px;
      background: #e9f7ef;
      border-radius: 5px;
      text-align: center;
      font-size: 18px;
      font-weight: bold;
    }
  </style>
</head>

<body>

<div class="container">
  <h2>Rata-rata Nilai</h2>

  <label>Al Quran Hadist</label>
  <input type="number" id="aqh">

  <label>Akidah Akhlaq</label>
  <input type="number" id="akidah">

  <label>Fiqih</label>
  <input type="number" id="fiqih">

  <label>Sejarah Kebudayaan Islam</label>
  <input type="number" id="ski">

  <button onclick="hitungRataRata()">Hitung</button>

  <div class="hasil" id="hasil">
    Hasil rata-rata akan muncul di sini
  </div>
</div>

<script>
function hitungRataRata() {

  let aqh = parseFloat(document.getElementById("aqh").value) || 0;
  let akidah = parseFloat(document.getElementById("akidah").value) || 0;
  let fiqih = parseFloat(document.getElementById("fiqih").value) || 0;
  let ski = parseFloat(document.getElementById("ski").value) || 0;

  // Menghitung rata-rata
  let rataRata = (aqh + akidah + fiqih + ski) / 4;

  // Pembulatan
  let pembulatan = Math.round(rataRata);

  document.getElementById("hasil").innerHTML =
    "Rata-rata: " + rataRata.toFixed(2) +
    "<br>Pembulatan: " + pembulatan;
}
</script>

</body>
</html>
